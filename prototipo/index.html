<title>Remarcá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: one-column phone app. Look of a corner-store sale poster: fluorescent paper colors, starbursts, chunky ink outlines and hard offset shadows, prices on yellow stickers. */
:root{
  --bg:#F4F0FF; --card:#FFFFFF; --ink:#17112F; --ink2:#4E4672; --ink3:#857EA6; --edge:#17112F; --line:#17112F; --line2:#ECE7FB;
  --yellow:#FFD84A; --pink:#E8508A; --blue:#3E33C9; --sky:#7FD3F2; --orange:#FFA65C; --lime:#B5E37A; --on:#17112F;
  --t-yellow:#FFF3C2; --t-pink:#FCE1EC; --t-sky:#DDF2FB; --t-lime:#E8F6D6; --t-orange:#FFE9D6;
  --tag:#FFD84A; --tag-ink:#17112F; --btn:#17112F; --btn-ink:#FFFFFF; --focus:#4D3BFF;
  --up:#D9400A; --up-bg:#FFE2D1; --down:#0D8545; --down-bg:#D5F7E2; --new:#3B2BE0; --new-bg:#E2DEFF; --warn:#8F5400; --warn-bg:#FFF0B8; --bad:#D0154A; --bad-bg:#FFDDE8;
  --bw:1.5px; --sh:3px 3px 0 var(--edge); --sh-sm:2px 2px 0 var(--edge);
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Archivo Black","Arial Black",Impact,system-ui,sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#120F22; --card:#1D1936; --ink:#F2F0FA; --ink2:#C0BAD8; --ink3:#8E88AC; --edge:#4A4275; --line:#4A4275; --line2:#2A2547;
  --t-yellow:#3A3216; --t-pink:#3D1D2C; --t-sky:#18313D; --t-lime:#25331A; --t-orange:#3D2818;
  --btn:#FFD84A; --btn-ink:#17112F; --focus:#9C8FFF;
  --up:#FF925C; --up-bg:#3D1F14; --down:#5EE09A; --down-bg:#123224; --new:#A9A0FF; --new-bg:#262058; --warn:#FFD25C; --warn-bg:#3A2D0C; --bad:#FF6F98; --bad-bg:#40142A;
  --sh:3px 3px 0 #05030D; --sh-sm:2px 2px 0 #05030D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#120F22; --card:#1D1936; --ink:#F2F0FA; --ink2:#C0BAD8; --ink3:#8E88AC; --edge:#4A4275; --line:#4A4275; --line2:#2A2547;
  --t-yellow:#3A3216; --t-pink:#3D1D2C; --t-sky:#18313D; --t-lime:#25331A; --t-orange:#3D2818;
  --btn:#FFD84A; --btn-ink:#17112F; --focus:#9C8FFF;
  --up:#FF925C; --up-bg:#3D1F14; --down:#5EE09A; --down-bg:#123224; --new:#A9A0FF; --new-bg:#262058; --warn:#FFD25C; --warn-bg:#3A2D0C; --bad:#FF6F98; --bad-bg:#40142A;
  --sh:3px 3px 0 #05030D; --sh-sm:2px 2px 0 #05030D; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.wrap{padding-inline:16px;padding-block:10px 24px;display:flex;flex-direction:column;gap:18px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:var(--bw) solid transparent}
.top.scrolled{border-bottom-color:var(--edge)}
.top h1{margin:0;font-family:var(--f-disp);font-weight:400;font-size:21px;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .back{border:var(--bw) solid var(--edge);background:var(--card);color:var(--on);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;box-shadow:var(--sh-sm);flex:none}
.top .back:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
.sync{font-size:12px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:6px;white-space:nowrap;background:var(--card);border:1px solid var(--line2);border-radius:999px;padding:3px 9px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--down);display:inline-block}
.sync.local i{background:var(--ink3)}
.sync.busy i{background:var(--orange);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

/* home hero */
.hero{position:relative;overflow:hidden;background:var(--blue);color:#fff;padding:16px 16px 48px;border-radius:0 0 24px 24px}
.hero .row{position:relative;z-index:2}
.hero .hello{font-weight:700;font-size:15px;opacity:.9}
.hero h1{margin:2px 0 0;font-family:var(--f-disp);font-weight:400;font-size:clamp(26px,7vw,34px);line-height:1;letter-spacing:-.02em;text-wrap:balance;position:relative;z-index:2}
.hero .sync{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.5);color:#fff}
.hero .deco{position:absolute;z-index:1;pointer-events:none}
.hero .d1{width:120px;right:-34px;top:-34px;opacity:.95}
.hero .d2{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.1);right:70px;bottom:-34px}
.hero .d3{display:none}
.hero .sticker{position:absolute;z-index:2;right:18px;bottom:16px;transform:rotate(-8deg)}
@keyframes spin{to{transform:rotate(360deg)}}

/* bottom nav */
.nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30}
.nav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1.3fr 1fr 1fr;align-items:end;background:var(--card);border:var(--bw) solid var(--edge);border-radius:22px;box-shadow:0 6px 20px rgba(23,17,47,.12);padding:4px 4px 6px}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--ink3);padding:6px 0;border-radius:16px}
.nav button.on{color:var(--ink);font-weight:800}
.nav button.on svg{background:var(--t-yellow);color:var(--ink);border-radius:10px;padding:3px;width:30px!important;height:30px!important}
.nav .fab{transform:translateY(-22px);color:var(--ink);font-weight:800}
.nav .fab .c{width:64px;height:64px;position:relative;display:grid;place-items:center;color:var(--on);filter:drop-shadow(2px 2px 0 var(--edge))}
.nav .fab .c svg.burst{position:absolute;inset:0;width:100%;height:100%}
.nav .fab .c svg.i{position:relative;stroke-width:3}
.nav .fab:active .c{transform:scale(.94)}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* basics */
.card{background:var(--card);border:var(--bw) solid var(--edge);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.card.flat{box-shadow:none;border-style:dashed}
h2{font-size:19px;margin:0;font-weight:800;text-wrap:balance;letter-spacing:-.01em}
h3{font-family:var(--f-body);font-weight:800;font-size:13px;margin:0;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
p{margin:0}
.muted{color:var(--ink2)}
.small{font-size:14px}
.tiny{font-size:12px;color:var(--ink3)}
.row{display:flex;align-items:center;gap:12px}
.row>.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-inline:2px}
.sec-h h3{display:inline-flex;align-items:center;gap:8px}
.sec-h h3::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--pink);transform:rotate(45deg)}
.sec-h button{border:0;background:none;color:var(--ink2);font-weight:700;font-size:14px;padding:4px 0}
.btn{border:var(--bw) solid var(--edge);border-radius:14px;padding:12px 18px;font-weight:800;font-size:16px;background:var(--btn);color:var(--btn-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;text-align:center;box-shadow:var(--sh-sm);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--edge)}
.btn.block{width:100%}
.btn.sec{background:var(--card);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border-style:dashed;box-shadow:none}
.btn.tagb{background:var(--yellow);color:var(--on)}
.btn.pink{background:var(--pink);color:#fff}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{min-height:40px;padding:7px 12px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>.btn{flex:1 1 140px}
.link{border:0;background:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:0;font-weight:700}

/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:var(--ink2)}
.inp{width:100%;border:var(--bw) solid var(--edge);background:var(--card);border-radius:14px;padding:11px 14px;font-size:16px;min-height:50px;font-weight:500}
.inp:focus{outline:none;box-shadow:var(--sh-sm);background:color-mix(in srgb,var(--yellow) 14%,var(--card))}
.inp-suf{position:relative}
.inp-suf .inp{padding-right:40px}
.inp-suf b{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--ink3);font-weight:700;pointer-events:none}
.inp-pre{position:relative}
.inp-pre .inp{padding-left:32px}
.inp-pre b{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink3);font-weight:700;pointer-events:none;display:flex}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>*{min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1.5px solid var(--edge);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;min-height:38px;white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0}
.toggle input{appearance:none;width:52px;height:30px;border-radius:999px;background:var(--line2);border:2px solid var(--edge);position:relative;flex:none;cursor:pointer;transition:background .15s}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--card);border:2px solid var(--edge);transition:transform .15s}
.toggle input:checked{background:var(--lime)}
.toggle input:checked::after{transform:translateX(22px)}
.chk{appearance:none;width:26px;height:26px;border-radius:8px;border:var(--bw) solid var(--edge);flex:none;display:grid;place-items:center;cursor:pointer;background:var(--card)}
.chk:checked{background:var(--lime)}
.chk:checked::after{content:"";width:6px;height:12px;border:solid var(--on);border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg)}

/* price tag sticker */
.tag{display:inline-flex;align-items:baseline;gap:2px;background:var(--tag);color:var(--tag-ink);font-family:var(--f-num);font-weight:800;font-size:22px;line-height:1;padding:5px 10px 4px 8px;border:1.5px solid var(--edge);border-radius:6px 14px 14px 6px;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:1.5px 1.5px 0 var(--edge)}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--card);border:1.5px solid var(--edge);margin-right:6px;align-self:center}
.tag small{font-size:.62em;margin-right:1px}
.tag.lg{font-size:32px}
.old{font-family:var(--f-num);font-weight:700;font-size:16px;color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--pink);text-decoration-thickness:2px;white-space:nowrap}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;border:1.5px solid currentColor}
.chip.up{background:var(--up-bg);color:var(--up)}
.chip.down{background:var(--down-bg);color:var(--down)}
.chip.new{background:var(--new-bg);color:var(--new)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.mute{background:var(--line2);color:var(--ink2);border-color:transparent}

/* lists */
.list{background:var(--card);border:var(--bw) solid var(--edge);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line2);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.li:first-child{border-top:0}
button.li:active,.rowbtn:active{background:var(--line2)}
.li .grow{flex:1;min-width:0}
.li .t,.li .s{display:block}
.li .t{font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.li .s{font-size:13px;color:var(--ink3);margin-top:2px;overflow-wrap:anywhere}
.li .r{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.li.hl{background:var(--t-yellow);box-shadow:inset 4px 0 0 var(--yellow)}
.rowbtn{display:flex;align-items:center;gap:12px;border:0;background:none;padding:0;text-align:left;min-width:0;color:inherit;flex:1;border-radius:10px}
.more{display:block;width:100%;border:0;border-top:2px dashed var(--line2);background:none;padding:12px;font-weight:800;color:var(--ink2)}

/* home */
.hero-cta{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;width:100%;border:var(--bw) solid var(--edge);text-align:left;background:var(--pink);color:#fff;border-radius:22px;padding:18px;box-shadow:var(--sh);margin-top:-30px;z-index:3;transition:transform .08s,box-shadow .08s}
.hero-cta:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--edge)}
.hero-cta .ic{width:62px;height:62px;border-radius:18px;background:var(--yellow);color:var(--on);display:grid;place-items:center;flex:none;border:var(--bw) solid var(--edge)}
.hero-cta b{display:block;font-family:var(--f-disp);font-weight:400;font-size:24px;line-height:1.05;letter-spacing:-.01em}
.hero-cta .sub{font-size:14.5px;font-weight:600;opacity:.95}
.hero-cta .arrow{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--on);display:grid;place-items:center;border:var(--bw) solid var(--edge);flex:none}
.hero-cta::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.16)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:var(--bw) solid var(--edge);border-radius:var(--r);padding:12px 10px;box-shadow:var(--sh-sm);min-width:0;color:var(--ink)}
.stat{background:var(--card);border-top:6px solid var(--yellow)}
.stat:nth-child(2){border-top-color:var(--sky)}
.stat:nth-child(3){border-top-color:var(--lime)}
.stat b{display:block;font-family:var(--f-disp);font-weight:400;font-size:26px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;font-weight:700}
.alert{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r);padding:14px;width:100%;border:var(--bw) solid var(--edge);text-align:left;box-shadow:var(--sh-sm)}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert .grow{flex:1;min-width:0}
.alert b{display:block;font-weight:800}
.alert span{font-size:14px;font-weight:500}

/* review summary */
.sum{position:relative;background:var(--card);border:var(--bw) solid var(--edge);border-radius:24px;box-shadow:var(--sh);padding:18px 16px;overflow:hidden}
.sum h2{font-family:var(--f-disp);font-weight:400;font-size:21px!important;line-height:1.1;letter-spacing:-.01em;max-width:80%}
.sum .burst-badge{position:absolute;right:-8px;top:-8px;width:86px;height:86px;display:grid;place-items:center;color:var(--on);transform:rotate(8deg)}
.sum .burst-badge svg{position:absolute;inset:0;width:100%;height:100%}
.sum .burst-badge span{position:relative;font-family:var(--f-disp);font-size:13px;line-height:1;text-align:center}
.sum .burst-badge span b{display:block;font-size:24px}
.sum-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.sum-nums button{border:var(--bw) solid var(--edge);border-radius:14px;padding:10px 10px 8px;text-align:left;color:var(--ink);border-left-width:6px}
.sum-nums b{display:block;font-family:var(--f-disp);font-weight:400;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.sum-nums span{font-size:13px;font-weight:800}
.sum-nums .up{background:var(--t-orange);border-left-color:var(--orange)}
.sum-nums .down{background:var(--t-lime);border-left-color:var(--lime)}
.sum-nums .new{background:var(--t-sky);border-left-color:var(--sky)}
.sum-nums button.on{outline:2px solid var(--ink);outline-offset:2px}
.applybar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30}
.applybar>div{max-width:600px;margin:0 auto;display:flex;gap:10px;align-items:center;background:var(--card);border:var(--bw) solid var(--edge);border-radius:22px;box-shadow:var(--sh);padding:10px 10px 10px 16px}
.doubt{border:var(--bw) dashed var(--orange);background:var(--card);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.doubt .src{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--line2);padding:6px 8px;border-radius:8px;overflow-wrap:anywhere}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden],[hidden]{display:none!important}
#sheet .bg{position:absolute;inset:0;background:rgba(17,12,38,.55)}
#sheet .pane{position:relative;background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border:var(--bw) solid var(--edge);border-bottom:0;border-radius:28px 28px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.2,1.3,.4,1)}
#sheet .grab{width:44px;height:6px;border-radius:3px;background:var(--ink3);margin:4px auto 12px}
#sheet .pane-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
#sheet .pane-h h2{flex:1;font-family:var(--f-disp);font-weight:400;font-size:21px}
#sheet .x{border:var(--bw) solid var(--edge);background:var(--card);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;box-shadow:var(--sh-sm)}
@keyframes up{from{transform:translateY(60px);opacity:.3}}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;width:min(92vw,520px);pointer-events:none}
.toast{background:var(--ink);color:var(--bg);border:var(--bw) solid var(--edge);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);pointer-events:auto;animation:up .22s cubic-bezier(.2,1.3,.4,1);font-size:15px;font-weight:600}
.toast .grow{flex:1}
.toast button{border:2px solid var(--edge);background:var(--yellow);color:var(--on);border-radius:10px;padding:6px 10px;font-weight:800}

/* processing */
.proc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-block:30px 20px}
.scan{width:130px;height:160px;border-radius:14px;background:var(--card);border:var(--bw) solid var(--edge);box-shadow:var(--sh);position:relative;overflow:hidden;padding:18px 14px;display:flex;flex-direction:column;gap:9px}
.scan i{height:7px;border-radius:4px;background:var(--line2);display:block}
.scan i:nth-child(odd){width:78%}
.scan i:nth-child(3n){background:color-mix(in srgb,var(--sky) 45%,var(--line2))}
.scan::after{content:"";position:absolute;left:0;right:0;height:30px;background:linear-gradient(180deg,transparent,rgba(255,225,53,.85),transparent);animation:scan 1.5s ease-in-out infinite}
@keyframes scan{0%{top:-30px}100%{top:160px}}
.bar{width:100%;max-width:320px;height:16px;border-radius:999px;background:var(--card);border:var(--bw) solid var(--edge);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pink);transition:width .3s}
@keyframes stripes{to{background-position:28px 0}}
.steps{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;max-width:320px}

<script>
'use strict';
/* ============ utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-5);
const NF0 = new Intl.NumberFormat('es-AR', {maximumFractionDigits: 0});
const NF2 = new Intl.NumberFormat('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const NF1 = new Intl.NumberFormat('es-AR', {maximumFractionDigits: 1});
const r2 = v => Math.round(v * 100) / 100;
function priceTxt(v){ if (v == null || !isFinite(v)) return '—'; const step = +(S.settings?.round) || 0; return (step >= 1 || Number.isInteger(v)) ? NF0.format(Math.round(v)) : NF2.format(v); }
function moneyHTML(v, cls=''){ return `<span class="tag ${cls}"><small>$</small>${priceTxt(v)}</span>`; }
const costTxt = v => (v == null || !isFinite(v)) ? '—' : '$ ' + NF2.format(v);
const pctTxt = v => (v > 0 ? '+' : v < 0 ? '−' : '') + NF1.format(Math.abs(v)) + ' %';
function fmtDate(ts){ if(!ts) return '—'; const d = new Date(ts); return d.toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit', year:'2-digit'}); }
function ago(ts){
  if (!ts) return 'nunca';
  const d = Math.floor((Date.now() - ts) / 86400000);
  if (d <= 0){ const h = Math.floor((Date.now()-ts)/3600000); return h <= 0 ? 'recién' : `hace ${h} h`; }
  if (d === 1) return 'ayer';
  if (d < 30) return `hace ${d} días`;
  const m = Math.floor(d/30); return m === 1 ? 'hace 1 mes' : `hace ${m} meses`;
}
/* números en formato argentino o internacional */
function parseNum(v){
  if (typeof v === 'number') return isFinite(v) ? v : NaN;
  let s = String(v ?? '').trim();
  if (!s) return NaN;
  s = s.replace(/[$\s]|ars|u\$s|usd/gi, '').replace(/[^\d.,-]/g, '');
  if (!/\d/.test(s)) return NaN;
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc > -1 && ld > -1){
    if (lc > ld) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/,/g, '');
  } else if (lc > -1){
    const dec = s.length - lc - 1;
    s = (dec === 3 && (s.match(/,/g)||[]).length >= 1 && s.length > 4 && !/^0,/.test(s)) ? s.replace(/,/g, '') : s.replace(/,/g, (m, i) => i === lc ? '.' : '');
    if ((s.match(/\./g)||[]).length > 1) s = s.replace(/\./g, '');
  } else if (ld > -1){
    const parts = s.split('.');
    if (parts.length > 2) s = s.replace(/\./g, '');
    else if (parts[1].length === 3 && parts[0].length >= 1 && parts[0] !== '0') s = s.replace('.', '');
  }
  const n = parseFloat(s);
  return isFinite(n) ? n : NaN;
}

/* ============ estado y guardado ============ */
const SECTIONS = ['settings', 'suppliers', 'products', 'maps', 'history'];
const LS = 'remarca.v1.';
const S = {settings: null, suppliers: [], products: [], maps: {}, history: []};
const TS = {};
const persist = {mode: 'local', col: null, meta: {}, timers: {}, queue: Promise.resolve(), pending: 0, ready: false, error: null};

function lsGet(k){ try { return JSON.parse(localStorage.getItem(LS + k) || 'null'); } catch { return null; } }
function lsSet(k, v){ try { localStorage.setItem(LS + k, JSON.stringify(v)); return true; } catch { return false; } }
function loadLocal(){
  for (const k of SECTIONS){
    const v = lsGet(k);
    if (v && v.d !== undefined){ S[k] = v.d; TS[k] = v.ts || 0; }
  }
  if (!Array.isArray(S.suppliers)) S.suppliers = [];
  if (!Array.isArray(S.products)) S.products = [];
  if (!Array.isArray(S.history)) S.history = [];
  if (!S.maps || typeof S.maps !== 'object') S.maps = {};
}
function save(...secs){
  for (const k of secs){
    TS[k] = Date.now();
    lsSet(k, {ts: TS[k], d: S[k]});
    if (k === 'products') invalidateIndex();
    if (persist.mode === 'cloud'){
      clearTimeout(persist.timers[k]);
      persist.timers[k] = setTimeout(() => queueCloud(k), 900);
      persist.pending++; persist.timers['_'+k] = (persist.timers['_'+k]||0) + 1;
    }
  }
  updateSync();
}
function queueCloud(k){
  const n = persist.timers['_'+k] || 0; persist.timers['_'+k] = 0;
  persist.queue = persist.queue.then(() => cloudWrite(k)).catch(e => cloudFail(e)).finally(() => { persist.pending = Math.max(0, persist.pending - n); updateSync(); });
}
const CHUNK = 80000;
async function cloudWrite(k){
  const json = JSON.stringify(S[k]);
  const ts = TS[k] || Date.now();
  const n = Math.max(1, Math.ceil(json.length / CHUNK));
  for (let i = 0; i < n; i++) await persist.col.doc(k + '_' + i).set({s: json.slice(i * CHUNK, (i + 1) * CHUNK)});
  await persist.col.doc(k + '_meta').set({n, ts});
  const prev = persist.meta[k]?.n || 0;
  for (let i = n; i < prev; i++) await persist.col.doc(k + '_' + i).delete().catch(() => {});
  persist.meta[k] = {n, ts};
}
function cloudFail(e){
  const c = e?.code;
  if (c === 'invalid_argument' || c === 'revoked' || c === 'not_granted'){
    persist.mode = 'local'; persist.error = 'Tus datos se guardan solo en este dispositivo.';
  } else if (c === 'quota_exceeded'){
    toast('Se llenó el espacio en la nube. Tus datos siguen guardados en este dispositivo.');
  }
}
async function initCloud(){
  try {
    const [db, user] = await Promise.all([capUse('db'), capUse('user')]);
    if (!db || !user) return;
    const uid = await user.id().catch(() => null);
    if (!uid) return;
    const col = db.doc('data/users/' + uid + '/remarca').collection('chunks');
    const snap = await col.limit(1000).get();
    const docs = {}; for (const d of snap.docs) docs[d.id] = d.data();
    persist.col = col; persist.mode = 'cloud';
    const toPush = [];
    for (const k of SECTIONS){
      const m = docs[k + '_meta'];
      let cloud = null;
      if (m && m.n){
        try { let s = ''; for (let i = 0; i < m.n; i++) s += docs[k + '_' + i]?.s ?? ''; cloud = JSON.parse(s); } catch { cloud = null; }
        persist.meta[k] = {n: m.n, ts: m.ts};
      }
      if (cloud !== null && (m.ts || 0) >= (TS[k] || 0)){
        S[k] = cloud; TS[k] = m.ts; lsSet(k, {ts: m.ts, d: cloud});
      } else if (TS[k] && S[k] != null){ toPush.push(k); }
    }
    invalidateIndex();
    for (const k of toPush){ persist.pending++; persist.timers['_'+k] = 1; queueCloud(k); }
  } catch (e) {
    persist.mode = 'local';
  }
}

/* capacidades del visor */
function capUse(name){
  try { return (window.claude && window.claude.use) ? Promise.resolve(window.claude.use(name)).catch(() => null) : Promise.resolve(null); }
  catch { return Promise.resolve(null); }
}
const AI = {s: null, limits: null, off: false, checked: false};
async function initAI(){
  const s = await capUse('sample');
  if (s){ AI.s = s; try { AI.limits = await s.limits(); } catch { AI.limits = null; } }
  AI.checked = true;
}
const aiOn = () => !!AI.s && !AI.off;
const aiImagesOn = () => aiOn() && !!AI.limits?.images;

/* ============ precios ============ */
const DEFAULT_SETTINGS = () => ({store: '', margin: 40, iva: 21, round: 10, roundMode: 'up', ending: '', bigChange: 20, categories: [], createdAt: Date.now(), demo: false});
const supById = id => S.suppliers.find(s => s.id === id);
let _byId = null;
function byId(id){ if (!_byId){ _byId = new Map(S.products.map(p => [p.id, p])); } return _byId.get(id); }
function catOf(name){ return (S.settings.categories || []).find(c => c.name === name); }
const hasVal = v => v !== null && v !== undefined && v !== '' && isFinite(+v);
function marginFor(p){
  if (p && hasVal(p.margin)) return +p.margin;
  const c = p && catOf(p.category); if (c && hasVal(c.margin)) return +c.margin;
  return +S.settings.margin || 0;
}
function ivaFor(cat){ const c = catOf(cat); return c && hasVal(c.iva) ? +c.iva : (+S.settings.iva || 0); }
function roundPrice(v){
  const end = S.settings.ending;
  if (end === '9') return Math.ceil((v + 1) / 10 - 1e-9) * 10 - 1;
  if (end === '90') return Math.ceil((v + 10) / 100 - 1e-9) * 100 - 10;
  if (end === '99') return Math.ceil((v + 1) / 100 - 1e-9) * 100 - 1;
  const step = +S.settings.round || 0;
  if (!step) return r2(v);
  const q = v / step;
  return (S.settings.roundMode === 'near' ? Math.round(q) : Math.ceil(q - 1e-9)) * step;
}
const priceFrom = (cost, p) => roundPrice(cost * (1 + marginFor(p) / 100));
/* costo que paga el comercio por unidad: lista → +IVA si corresponde → −bonificación */
/* cuántas unidades de venta trae el precio de lista (bulto x 12 → 12; kilo vendido por 100 g → 10) */
function packOf(p){
  if (!p) return 1;
  const b = p.buy || {};
  let n = b.type === 'pack' ? (+b.n || 1) : 1;
  if (b.type === 'kg' && p.sell === '100g') n = 10;
  return n > 0 ? n : 1;
}
const UNIT_TXT = {u: '', kg: 'por kg', '100g': 'x 100 g'};
const unitTxt = p => UNIT_TXT[p?.sell || 'u'] || '';
function pushHist(p, ts){ p.hist = (p.hist || []).concat([[ts, p.cost, p.price]]).slice(-12); }
function costFromList(listed, sup, cat, ivaOverride, pack = 1){
  let c = +listed / (pack > 0 ? pack : 1);
  const inc = ivaOverride ?? !!sup.ivaIncluded;
  if (!inc) c *= 1 + ivaFor(cat) / 100;
  if (+sup.discount) c *= 1 - (+sup.discount) / 100;
  return r2(c);
}
const isLoss = p => p.cost > 0 && p.price > 0 && p.price < p.cost - 0.005;
const realMargin = p => p.cost > 0 ? (p.price / p.cost - 1) * 100 : null;

/* ============ vinculación con el catálogo ============ */
const STOP = new Set(['de','del','la','el','los','las','con','sin','en','y','p','x','por','para','a','al','e']);
function norm(s){
  s = String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  s = s.replace(/(\d),(\d)/g, '$1.$2');
  s = s.replace(/(\d+(?:\.\d+)?)\s*(kgs?|kilos?|kilogramos?|k)\b/g, '$1kg')
       .replace(/(\d+(?:\.\d+)?)\s*(grs?|gramos?|gms?|g)\b/g, '$1g')
       .replace(/(\d+(?:\.\d+)?)\s*(cc|ml|cm3|mililitros?)\b/g, '$1ml')
       .replace(/(\d+(?:\.\d+)?)\s*(lts?|litros?|l)\b/g, '$1l')
       .replace(/(\d+)\s*(unidades|unid|uds?|un|u)\b/g, '$1u');
  s = s.replace(/\b(\d+(?:\.\d+)?)g\b/g, (m, n) => (+n >= 1000 && +n % 1000 === 0) ? (+n / 1000) + 'kg' : m)
       .replace(/\b(\d+(?:\.\d+)?)ml\b/g, (m, n) => (+n >= 1000 && +n % 1000 === 0) ? (+n / 1000) + 'l' : m)
       .replace(/\b0\.(\d+)kg\b/g, (m, n) => Math.round(parseFloat('0.' + n) * 1000) + 'g')
       .replace(/\b0\.(\d+)l\b/g, (m, n) => Math.round(parseFloat('0.' + n) * 1000) + 'ml');
  s = s.replace(/[^a-z0-9.]+/g, ' ').replace(/(^|[^0-9])\.|\.(?![0-9])/g, '$1 ');
  return s.replace(/\s+/g, ' ').trim();
}
function prep(text){
  const n = norm(text);
  const toks = n.split(' ').filter(t => t && !STOP.has(t));
  const tok = new Set(toks);
  const joined = ' ' + toks.join(' ') + ' ';
  const tri = new Set(); for (let i = 0; i < joined.length - 2; i++) tri.add(joined.slice(i, i + 3));
  const nums = new Set(toks.filter(t => /\d/.test(t)));
  return {n, tok, tri, nums};
}
function dice(a, b){ if (!a.size || !b.size) return 0; let i = 0; const [s, l] = a.size < b.size ? [a, b] : [b, a]; for (const x of s) if (l.has(x)) i++; return 2 * i / (a.size + b.size); }
function sim(a, b){
  if (a.n && a.n === b.n) return 1;
  let s = 0.55 * dice(a.tok, b.tok) + 0.45 * dice(a.tri, b.tri);
  if (a.nums.size && b.nums.size){ let shared = false; for (const x of a.nums) if (b.nums.has(x)) { shared = true; break; } if (!shared) s *= 0.45; }
  else if (a.nums.size !== b.nums.size && (a.nums.size || b.nums.size)) s *= 0.9;
  return s;
}
let _idx = null;
function invalidateIndex(){ _idx = null; _byId = null; }
function getIndex(){
  if (_idx) return _idx;
  const inv = new Map(); const pre = new Map(); const byCode = new Map();
  for (const p of S.products){
    const pr = prep(p.name); pre.set(p.id, pr);
    for (const t of pr.tok){ if (!inv.has(t)) inv.set(t, []); inv.get(t).push(p.id); }
    if (p.code) byCode.set(normCode(p.code), p);
  }
  _idx = {inv, pre, byCode};
  return _idx;
}
const normCode = c => String(c || '').trim().toLowerCase().replace(/^0+(?=\d)/, '').replace(/\s+/g, '');
function itemKey(code, desc){ return code ? 'c:' + normCode(code) : 'd:' + norm(desc); }
function candidates(desc, supId, n = 5){
  const idx = getIndex(); const q = prep(desc);
  const seen = new Set(); const out = [];
  const total = S.products.length || 1;
  for (const t of q.tok){
    const ids = idx.inv.get(t); if (!ids) continue;
    if (ids.length > Math.max(60, total * 0.35) && q.tok.size > 1) continue;
    for (const id of ids){ if (seen.has(id)) continue; seen.add(id);
      const p = byId(id); const pp = idx.pre.get(id); let sc = sim(q, pp);
      // una palabra distintiva del renglón (marca, variedad) que el producto no tiene: probablemente es otro producto
      if (sc < 1){
        let miss = false;
        for (const t of q.tok){ if (/\d/.test(t) || pp.tok.has(t)) continue; const df = idx.inv.get(t)?.length || 0; if (df >= 1 && df <= 3){ sc *= 0.7; miss = true; } }
        // y además el producto tiene otra marca o variedad propia: casi seguro que no es
        if (miss) for (const t of pp.tok){ if (/\d/.test(t) || q.tok.has(t)) continue; const df = idx.inv.get(t)?.length || 0; if (df >= 1 && df <= 3){ sc *= 0.6; break; } }
      }
      if (p && supId && p.supplierId === supId) sc = Math.min(1, sc + 0.03);
      out.push({id, score: sc});
    }
  }
  out.sort((a, b) => b.score - a.score);
  return out.slice(0, n);
}
function matchItems(raw, sup){
  const maps = S.maps[sup.id] || {};
  const idx = getIndex();
  return raw.map(r => {
    const key = itemKey(r.code, r.desc);
    const it = {key, code: r.code || '', desc: r.desc, listed: r.cost, productId: null, match: null, score: 0, cands: [], include: true, doubt: false, ignored: false, override: null, newCat: '', note: r.note || '', aiPack: r.pack > 1 ? r.pack : 1, pack: null};
    const m = maps[key];
    if (m === '-'){ it.ignored = true; it.include = false; it.match = 'ignorado'; return it; }
    if (m && byId(m)){ it.productId = m; it.match = 'memoria'; return it; }
    if (r.code){
      const p = idx.byCode.get(normCode(r.code));
      if (p && (!p.supplierId || p.supplierId === sup.id)){ it.productId = p.id; it.match = 'codigo'; return it; }
    }
    const c = candidates(r.desc, sup.id);
    it.cands = c.map(x => x.id);
    const b = c[0], s2 = c[1]?.score ?? 0;
    if (b){
      it.score = b.score;
      if (b.score >= 0.97 && s2 < 0.97){ it.productId = b.id; it.match = 'exacto'; }
      else if (b.score >= 0.84 && s2 < b.score - 0.06){ it.productId = b.id; it.match = 'similar'; }
      else if (b.score >= 0.42){ it.doubt = true; it.include = false; it.suggest = b.id; }
    }
    return it;
  });
}

const _libs = {};
function loadLib(name){
  if (_libs[name]) return _libs[name];
  _libs[name] = LIBS[name].reduce((p, src) => p.then(() => new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.onload = res;
    s.onerror = () => { delete _libs[name]; rej(new UserErr('No se pudo cargar una herramienta necesaria. Revisá tu conexión y probá de nuevo.')); };
    document.head.appendChild(s);
  })), Promise.resolve());
  return _libs[name];
}

async function readSheetRows(file){
  await loadLib('xlsx');
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type: 'array', cellDates: false});
  let best = null;
  for (const n of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[n], {header: 1, raw: true, defval: ''});
    const filled = rows.filter(r => r.some(c => String(c).trim() !== ''));
    if (!best || filled.length > best.length) best = filled;
  }

}
const KW = {
  code: /^(cod|c[oó]d(igo)?|sku|art(\.|[ií]culo)?\s*(n|nro|#)?|ean|ref|item|id|plu)\b/i,
  desc: /(desc|producto|art[ií]culo|detalle|nombre|item|mercader)/i,
  cost: /(costo|precio|p\.?\s?unit|unitario|lista|neto|importe|valor|\$|pcio|final)/i,
  cat: /(rubro|categor|familia|secci[oó]n|grupo|l[ií]nea)/i,

  sup: /(proveedor|marca|distrib)/i
};
function guessCols(rows, forCatalog){
  let hdr = -1, best = 0;
  for (let i = 0; i < Math.min(rows.length, 20); i++){
    const r = rows[i]; let sc = 0;
    for (const c of r){ const s = String(c); if (typeof c === 'string' && s.length < 40 && (KW.desc.test(s) || KW.cost.test(s) || KW.code.test(s) || KW.cat.test(s))) sc++; }
    if (sc > best){ best = sc; hdr = i; }
  }
  const H = hdr >= 0 ? rows[hdr].map(String) : [];
  const data = rows.slice(hdr + 1, hdr + 60);
  const ncol = Math.max(...rows.slice(0, 60).map(r => r.length), 0);
  const numRatio = j => { let n = 0, t = 0; for (const r of data){ const v = r[j]; if (v === '' || v == null) continue; t++; if (isFinite(parseNum(v)) && parseNum(v) > 0) n++; } return t ? n / t : 0; };
  const textLen = j => { let L = 0, t = 0; for (const r of data){ const v = r[j]; if (typeof v === 'string' && /[a-záéíóúñ]/i.test(v)){ L += v.length; t++; } } return t ? L / Math.max(1, data.length) : 0; };
  const find = (re, not) => { for (let j = 0; j < H.length; j++) if (re.test(H[j]) && !(not && not.some(x => x === j))) return j; return -1; };
  const cols = {header: hdr, code: -1, desc: -1, cost: -1, cat: -1, price: -1};
  cols.code = find(KW.code);
  cols.desc = find(KW.desc, [cols.code]);
  if (forCatalog){ cols.price = find(KW.price); cols.cat = find(KW.cat); }
  const costCands = []; for (let j = 0; j < H.length; j++) if (KW.cost.test(H[j]) && j !== cols.price && j !== cols.code && j !== cols.desc) costCands.push(j);
  const pref = costCands.find(j => /(costo|neto|s\/?\s?iva|sin iva|contado)/i.test(H[j]));
  cols.cost = pref ?? costCands.find(j => numRatio(j) > 0.6) ?? -1;
  if (forCatalog && cols.price === -1 && cols.cost !== -1 && costCands.length === 1 && !/costo|neto/i.test(H[cols.cost])){ cols.price = cols.cost; cols.cost = -1; }
  if (cols.desc === -1){ let bj = -1, bl = 0; for (let j = 0; j < ncol; j++){ if (j === cols.code) continue; const l = textLen(j); if (l > bl){ bl = l; bj = j; } } cols.desc = bj; }
  if (cols.cost === -1 && !forCatalog){ for (let j = ncol - 1; j >= 0; j--){ if (j === cols.code || j === cols.desc) continue; if (numRatio(j) > 0.7){ cols.cost = j; break; } } }
  return cols;
}
function rowsToItems(rows, cols){
  const out = [];
  for (let i = cols.header + 1; i < rows.length; i++){
    const r = rows[i];
    const desc = String(r[cols.desc] ?? '').trim();
    const cost = parseNum(r[cols.cost]);
    if (!desc || !/[a-záéíóúñ]/i.test(desc) || !(cost > 0)) continue;
    out.push({code: cols.code >= 0 ? String(r[cols.code] ?? '').trim() : '', desc, cost});
  }
  return out;
}
async function readPdf(file, onProg){
  await loadLib('pdf');
  const pdf = await pdfjsLib.getDocument({data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false}).promise;
  const pages = Math.min(pdf.numPages, 30);
  const lines = []; let chars = 0;
  for (let p = 1; p <= pages; p++){
    onProg?.(`Leyendo página ${p} de ${pages}`, p / pages * 0.3);
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const rows = [];
    for (const it of tc.items){
      if (!it.str || !it.str.trim()) continue;
      const y = it.transform[5], x = it.transform[4];
      let row = rows.find(r => Math.abs(r.y - y) < 3);
      if (!row){ row = {y, parts: []}; rows.push(row); }
      row.parts.push({x, s: it.str, w: it.width || 0});
    }
    rows.sort((a, b) => b.y - a.y);
    for (const r of rows){
      r.parts.sort((a, b) => a.x - b.x);
      let line = '', lastEnd = null;
      for (const pt of r.parts){ if (lastEnd !== null) line += (pt.x - lastEnd > 12 ? '  |  ' : ' '); line += pt.s.trim(); lastEnd = pt.x + pt.w; }
      lines.push(line); chars += line.length;
    }
  }
  if (chars > 40 * pages) return {lines};
  const imgs = [];
  for (let p = 1; p <= Math.min(pages, 10); p++){
    onProg?.(`Preparando página ${p} para leerla`, 0.3);
    const page = await pdf.getPage(p);
    const vp0 = page.getViewport({scale: 1});
    const vp = page.getViewport({scale: Math.min(2.5, 1800 / Math.max(vp0.width, vp0.height))});
    const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    await page.render({canvasContext: ctx, viewport: vp}).promise;
    imgs.push(await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.85)));
  }
  return {images: imgs, scanned: true};
}
async function shrinkImage(file){
  let src;
  try { src = await createImageBitmap(file); }
  catch {
    src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new UserErr('No se pudo abrir la imagen. Probá con otra foto.')); im.src = URL.createObjectURL(file); });
  }
  const w = src.width, h = src.height, k = Math.min(1, 2000 / Math.max(w, h));
  const cv = document.createElement('canvas'); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
  const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(src, 0, 0, cv.width, cv.height);
  return new Promise(res => cv.toBlob(res, 'image/jpeg', 0.85));
}
/* lectura sin IA: última cifra con forma de precio en cada renglón */
function heuristicLines(lines){
  const out = [];
  const priceRe = /\$?\s?\d{1,3}(?:[.\s]\d{3})+(?:,\d{1,2})?|\$?\s?\d+(?:[.,]\d{1,2})?/g;
  for (let raw of lines){
    const line = String(raw).replace(/\s*\|\s*/g, '   ').trim();
    if (!/[a-záéíóúñ]{3,}/i.test(line)) continue;
    const ms = [...line.matchAll(priceRe)];
    if (!ms.length) continue;
    const last = ms[ms.length - 1];
    const cost = parseNum(last[0]);
    if (!(cost > 0)) continue;
    let rest = (line.slice(0, last.index) + ' ' + line.slice(last.index + last[0].length)).trim();
    let code = '';
    const cm = rest.match(/^([A-Z0-9][A-Z0-9\-\/.]{1,11})\s+(?=\S)/i);
    if (cm && /\d/.test(cm[1])){ code = cm[1]; rest = rest.slice(cm[0].length); }
    rest = rest.replace(/\s+\$?\s*$/, '').replace(/\s{2,}/g, ' ').trim();
    if (rest.length < 3) continue;
    const pm = rest.match(/\b(?:caja|bulto|pack|display|cj|bto)\s*(?:x|de)?\s*(\d{1,3})\s*(?:u|un|unid|unidades)?\b/i);
    out.push({code, desc: rest, cost, pack: pm ? Math.max(1, +pm[1]) : 1});
  }
  return out;
}

function aiErrMsg(e){
  const c = e?.code;
  if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(c)){ AI.off = true; return 'La lectura con IA no está habilitada en este acceso. Podés subir la lista en Excel o pegarla como texto.'; }
  if (c === 'rate_limited') return 'Se alcanzó el límite de uso de la IA por ahora. Probá de nuevo en unos minutos.';
  if (c === 'session_expired') return 'Tu sesión venció. Volvé a iniciar sesión y probá otra vez.';
  if (c === 'image_rejected') return 'No se pudo leer la imagen. Probá con otra foto, más nítida y con buena luz.';
  if (c === 'images_unavailable'){ return 'La lectura de fotos no está disponible en este acceso. Subí la lista en PDF, Excel o como texto.'; }
  if (c === 'prompt_too_large') return 'La lista es demasiado larga para leerla de una vez. Probá dividirla en partes.';
  if (c === 'cancelled') return 'cancelled';
  if (c === 'refused' || c === 'invalid_json' || c === 'empty_completion') return 'La IA no pudo interpretar esta parte de la lista.';
  return 'Hubo un problema de conexión con la IA. Probá de nuevo.';
}
function extractPrompt(sup, what){

  return `Sos un asistente que lee listas de precios de proveedores mayoristas para un comercio minorista de Argentina.

Extraé CADA producto con su precio de costo unitario.

El cuarto valor de cada ítem es cuántas unidades de venta incluye ese precio: 1 si es precio por unidad o por kilo; si el único precio es por bulto, caja, pack o display (por ejemplo "caja x 12", "pack x 6", "x24u"), poné esa cantidad.`;
}
function cleanAiItems(res){
  const arr = Array.isArray(res) ? res : (res && Array.isArray(res.items) ? res.items : []);
  const out = [];
  for (const x of arr){
    let code = '', desc = '', cost = NaN, pack = 1;
    if (Array.isArray(x)){ [code, desc, cost, pack] = x.length >= 3 ? x : ['', x[0], x[1], 1]; }
    else if (x && typeof x === 'object'){ code = x.codigo ?? x.code ?? ''; desc = x.descripcion ?? x.desc ?? x.nombre ?? ''; cost = x.precio ?? x.costo ?? x.cost; pack = x.unidades ?? 1; }
    pack = Math.round(+pack); if (!(pack >= 1 && pack <= 1000)) pack = 1;
    cost = parseNum(cost); desc = String(desc ?? '').trim(); code = String(code ?? '').trim();
    if (desc && cost > 0) out.push({code, desc, cost, pack});
  }
  return out;
}

async function aiExtractText(lines, sup, signal, onProg){
  const items = []; const warn = []; let meta = {};
  const clean = lines.map(l => String(l).trim()).filter(l => l && /\d/.test(l));
  const chunks = []; let cur = [], size = 0;
  for (const l of clean){ cur.push(l); size += l.length; if (cur.length >= 140 || size > 9000){ chunks.push(cur); cur = []; size = 0; } }
  if (cur.length) chunks.push(cur);
  for (let i = 0; i < chunks.length; i++){
    onProg?.(`Interpretando la lista con IA${chunks.length > 1 ? ` (parte ${i + 1} de ${chunks.length})` : ''}`, 0.35 + 0.45 * (i / chunks.length));
    try {
      const res = await AI.s.json(extractPrompt(sup, `Este es el texto de ${chunks.length > 1 ? `la parte ${i + 1} de ${chunks.length} de ` : ''}la lista de precios del proveedor "${sup.name}" (las columnas pueden venir separadas por "|" o espacios):\n"""\n${chunks[i].join('\n')}\n"""`), {signal, modelTier: 'default'});
      items.push(...cleanAiItems(res));
      if (res && !Array.isArray(res)) meta = {iva: res.iva || meta.iva, columna: res.columna || meta.columna};
    } catch (e) {
      const m = aiErrMsg(e);
      if (m === 'cancelled') throw e;

        if (!items.length){ const h = heuristicLines(clean); if (h.length){ warn.push(m + ' Leímos la lista sin IA; revisá los resultados.'); return {items: h, warn, meta}; } }
        throw new UserErr(m);

    }
  }
  return {items, warn, meta};
}

  for (const b of batches){
    onProg?.(`Confirmando coincidencias dudosas con IA (${Math.min(done + b.length, items.length)} de ${items.length})`, 0.85 + 0.12 * (done / items.length));
    const payload = b.map((it, i) => ({i, lista: it.desc, opciones: it.cands.slice(0, 5).map(id => ({id, n: byId(id)?.name}))}));
    try {
      const res = await AI.s.json(`Un comercio recibió la lista de un proveedor. Para cada renglón de la lista, decidí cuál producto del catálogo del comercio es EXACTAMENTE el mismo producto: misma marca, misma variedad y misma presentación (peso, volumen o cantidad). Las abreviaturas son comunes ("YERBA PLAY 1K" = "Yerba Playadito 1 kg"). Si ninguno es el mismo, respondé null. Ante la duda entre tamaños o variedades distintas, respondé null.

      if (Array.isArray(res)) for (const pair of res){
        if (!Array.isArray(pair)) continue;

  }

/* estrella de cartel de oferta */
function burst(fill, pts = 14, inner = 0.8, extra = ''){
  const P = []; for (let i = 0; i < pts * 2; i++){ const a = Math.PI * i / pts - Math.PI / 2, r = i % 2 ? 46 * inner : 46; P.push((50 + r * Math.cos(a)).toFixed(1) + ',' + (50 + r * Math.sin(a)).toFixed(1)); }
  return `<svg class="burst ${extra}" viewBox="0 0 100 100" aria-hidden="true"><polygon points="${P.join(' ')}" fill="${fill}" stroke="var(--edge)" stroke-width="3" stroke-linejoin="round"/></svg>`;
}
function avatar(name){ let h = 0; for (const ch of String(name || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return `<span class="avatar c${h % 5}">${esc((String(name || '?')[0] || '?').toUpperCase())}</span>`; }
const ic = (n, s = 24) => `<svg class="i" viewBox="0 0 24 24" style="width:${s}px;height:${s}px" aria-hidden="true">${I[n]}</svg>`;

  if (S.history.length){
    h += `<div class="sec-h"><h3>Últimas listas</h3></div><div class="list">`;
    for (const b of S.history.slice(0, 8)){
      h += `<button class="li" data-a="batch" data-id="${b.id}">${avatar(b.supName)}<span class="grow"><span class="t">${esc(b.supName)}</span><span class="s">${fmtDate(b.at)} · ${batchLine(b)}</span></span><span class="r">${b.undone ? '<span class="chip mute">Deshecha</span>' : `<span class="chip mute">${b.changes.length} cambios</span>`}</span></button>`;

function batchLine(b){
  if (b.source === 'recalculo') return 'Recálculo con márgenes';
  const c = b.counts || {}; const p = [];
  if (c.up) p.push(`subieron ${c.up}`); if (c.down) p.push(`bajaron ${c.down}`); if (c.new) p.push(`${c.new} nuevos`);
  return p.join(', ') || 'sin cambios';
}

function filteredProducts(){
  const qs = norm(ui.q).split(' ').filter(Boolean);
  let arr = S.products;
  if (ui.filter === 'loss') arr = arr.filter(isLoss);
  else if (ui.filter.startsWith('cat:')) arr = arr.filter(p => (p.category || '') === ui.filter.slice(4));

  if (qs.length) arr = arr.filter(p => { const h = norm(`${p.name} ${p.code} ${p.category}`); return qs.every(q => h.includes(q)); });
  return arr.slice().sort((a, b) => a.name.localeCompare(b.name, 'es'));
}

function setProg(msg, pct){
  if (!ui.proc) return;
  ui.proc.msg = msg; if (pct != null) ui.proc.pct = Math.max(ui.proc.pct || 0, pct);
  if (ui.screen === 'processing') render();

/* ============ flujo de lectura ============ */
async function runPipeline(kind, payload){
  const sup = supById(ui.nl.supId);
  const ctl = new AbortController();
  ui.proc = {supId: sup.id, msg: 'Preparando…', pct: 0.03, ctl, error: null, needCols: null};
  screen('processing');
  const prog = (m, p) => { if (!ctl.signal.aborted) setProg(m, p); };
  try {
    let res = {items: [], warn: [], meta: {}}, fileName = payload?.name || '', source = kind;
    if (kind === 'images'){
      prog('Preparando las fotos', 0.1);
      const blobs = [];
      for (const ph of payload.photos) blobs.push(await shrinkImage(ph.file));
      if (!aiImagesOn()) throw new UserErr('La lectura de fotos no está disponible en este acceso. Subí la lista en PDF, Excel o como texto.');
      res = await aiExtractImages(blobs, sup, ctl.signal, prog);
      fileName = `${blobs.length} ${blobs.length === 1 ? 'foto' : 'fotos'}`;
    } else if (kind === 'pdf'){
      prog('Abriendo el PDF', 0.08);
      const r = await readPdf(payload, prog);
      if (r.images){
        if (!aiImagesOn()) throw new UserErr('Este PDF es una imagen escaneada y para leerlo hace falta la IA, que no está disponible en este acceso. Pedile al proveedor la lista en Excel o pegala como texto.');
        res = await aiExtractImages(r.images, sup, ctl.signal, prog);
      } else if (aiOn()) res = await aiExtractText(r.lines, sup, ctl.signal, prog);
      else res = {items: heuristicLines(r.lines), warn: ['Se leyó sin IA. Revisá que los productos y precios sean correctos.'], meta: {}};
    } else if (kind === 'sheet'){
      prog('Abriendo la planilla', 0.1);
      const rows = await readSheetRows(payload);
      if (!rows.length) throw new UserErr('La planilla está vacía.');
      let cols = null, meta = {};
      if (sup.cols && rows[sup.cols.header + 1]) cols = sup.cols;
      if (!cols && aiOn()){
        prog('Reconociendo las columnas con IA', 0.3);
        try { const r = await aiDetectCols(rows, sup, ctl.signal); if (r){ cols = r.cols; meta = r.meta; } } catch (e) { if (e?.code === 'cancelled') throw e; }
      }
      if (!cols){ const g = guessCols(rows, false); if (g.desc >= 0 && g.cost >= 0 && rowsToItems(rows, g).length >= Math.min(3, rows.length - 1)) cols = g; }
      let items = cols ? rowsToItems(rows, cols) : [];
      if (!items.length){
        cols = await new Promise((resolve, reject) => { ui.proc.needCols = {rows, cols: cols || guessCols(rows, false), resolve, reject}; render(); });
        ui.proc.needCols = null; render();
        items = rowsToItems(rows, cols);
        sup.cols = cols; save('suppliers');
      } else if (cols !== sup.cols){ sup.cols = cols; save('suppliers'); }
      res = {items, warn: [], meta};
    } else if (kind === 'text'){
      const lines = String(payload.text).split(/\r?\n/);
      fileName = 'Texto pegado';
      if (aiOn()) res = await aiExtractText(lines, sup, ctl.signal, prog);
      else res = {items: heuristicLines(lines), warn: ['Se leyó sin IA. Revisá que los productos y precios sean correctos.'], meta: {}};
    }
    if (ctl.signal.aborted) return;
    // limpiar y quitar duplicados
    const seen = new Map();
    for (const it of res.items){ if (!(it.cost > 0) || it.cost > 1e9) continue; seen.set(itemKey(it.code, it.desc), it); }
    const raw = [...seen.values()];
    if (!raw.length) throw new UserErr(res.warn?.[0] || 'No encontramos productos con precio en la lista. Probá con una foto más nítida o con el archivo original.');
    prog('Buscando cada producto en tu catálogo', 0.82);
    await new Promise(r => setTimeout(r, 30));
    const items = matchItems(raw, sup);
    const doubts = items.filter(i => i.doubt);
    if (doubts.length && aiOn() && doubts.length <= 200){
      try { await aiResolveDoubts(doubts, ctl.signal, prog); } catch (e) { if (e?.code === 'cancelled') return; }
    }
    if (ctl.signal.aborted) return;
    for (const it of items) if (!it.productId && !it.doubt && !it.ignored) it.include = S.products.length < 10;
    if (res.meta?.columna && !sup.aiHint){ sup.aiHint = `Precio tomado de: ${res.meta.columna}`; save('suppliers'); }
    prog('Calculando precios de venta', 0.99);
    ui.review = {supId: sup.id, items, source, fileName, meta: res.meta || {}, warn: res.warn || [], filter: null, newCat: '', ivaOverride: null, open: {}, leave: false};
    ui.proc = null;
    screen('review');
  } catch (e) {
    if (ctl.signal.aborted || e?.code === 'cancelled') return;
    console.error(e);
    if (ui.proc){ ui.proc.error = e instanceof UserErr ? e.message : (e?.code ? aiErrMsg(e) : 'No se pudo leer el archivo. Verificá que sea una lista de precios y probá de nuevo.'); ui.proc.needCols = null; render(); }
  }
}

/* ============ revisión ============ */
function calcItem(it, R, sup){
  const o = {st: '', nc: 0, np: 0, oc: null, op: null, pct: null, big: false, p: null, pack: 1, lock: false, loss: false, odd: false};
  if (it.ignored){ o.st = 'ignored'; }
  else if (it.doubt){ o.st = 'doubt'; }
  const p = it.productId ? byId(it.productId) : null; o.p = p;
  const cat = p ? p.category : (it.newCat || R.newCat || '');
  o.pack = it.pack ? +it.pack : (p && p.buy ? packOf(p) : (it.aiPack || 1));
  o.nc = costFromList(it.listed, sup, cat, R.ivaOverride, o.pack);
  if (o.st) { o.np = priceFrom(o.nc, p || {category: cat}); return o; }
  if (!p){ o.st = 'new'; o.np = hasVal(it.override) ? +it.override : priceFrom(o.nc, {category: cat}); o.loss = o.np < o.nc - 0.005; return o; }
  o.oc = p.cost; o.op = p.price; o.lock = !!p.lock;
  o.np = hasVal(it.override) ? +it.override : (p.lock ? p.price : priceFrom(o.nc, p));
  o.loss = o.np < o.nc - 0.005;
  const dc = o.nc - o.oc, dp = o.np - o.op;
  if (Math.abs(dc) < 0.005 && Math.abs(dp) < 0.005) o.st = 'same';
  else o.st = (dc > 0.004 || (Math.abs(dc) <= 0.004 && dp > 0)) ? 'up' : 'down';
  o.pct = o.oc > 0 ? (o.nc / o.oc - 1) * 100 : null;
  o.big = o.pct != null && Math.abs(o.pct) >= (+S.settings.bigChange || 20);
  o.odd = o.pct != null && (o.pct > 150 || o.pct < -60);
  if (o.loss) o.big = true;
  return o;
}
function reviewCalc(){
  const R = ui.review, sup = supById(R.supId);
  const C = R.items.map(it => calcItem(it, R, sup));
  const n = {up: 0, down: 0, new: 0, same: 0, ignored: 0, doubt: 0};
  C.forEach(c => n[c.st]++);
  let apply = 0;
  R.items.forEach((it, i) => { const c = C[i]; if ((c.st === 'up' || c.st === 'down' || c.st === 'new') && it.include) apply++; });
  return {R, sup, C, n, apply};
}
function rvRow(it, c, i){
  const name = c.p ? c.p.name : tidyName(it.desc);
  const matchNote = it.match === 'ia' ? '<span class="chip new">vinculado con IA</span>' : it.match === 'similar' ? '<span class="chip mute">nombre parecido</span>' : it.match === 'manual' ? '<span class="chip mute">elegido por vos</span>' : '';
  const showSrc = c.p && norm(c.p.name) !== norm(it.desc);
  let chip = c.st === 'new' ? '<span class="chip new">nuevo</span>' : c.pct != null ? `<span class="chip ${c.st === 'up' ? 'up' : 'down'}">${pctTxt(c.pct)}</span>` : (c.st === 'up' ? '<span class="chip warn">primer costo</span>' : '');
  if (c.loss) chip = '<span class="chip bad">a pérdida</span>' + chip;
  const extra = [c.pack > 1 ? `<span class="chip mute">precio ÷ ${c.pack}</span>` : '', c.lock ? '<span class="chip mute">precio fijo</span>' : '', c.odd ? '<span class="chip warn">¿cambió la presentación?</span>' : ''].join(' ');
  return `<div class="li ${c.big ? 'hl' : ''}"><input type="checkbox" class="chk" data-a="rvToggle" data-i="${i}" ${it.include ? 'checked' : ''} aria-label="Incluir ${esc(name)}">
    <button class="grow rowbtn" data-a="rvItem" data-i="${i}"><span class="grow"><span class="t">${esc(name)}</span>
      <span class="s num">Costo ${c.oc != null ? `${costTxt(c.oc)} → ${NF2.format(c.nc)}` : costTxt(c.nc)}${hasVal(it.override) ? ' · precio a mano' : ''}</span>
      ${showSrc || matchNote || extra.trim() ? `<span class="s">${matchNote} ${extra} ${showSrc ? 'En la lista: ' + esc(it.desc) : ''}</span>` : ''}</span>
      <span class="r">${c.op != null ? `<span class="old">$ ${priceTxt(c.op)}</span>` : ''}${moneyHTML(c.np)}${chip}</span></button></div>`;
}

  } else if (R.ivaOverride != null){

function applyReview(){
  const {R, sup, C} = reviewCalc();
  const now = Date.now();
  const maps = S.maps[sup.id] || (S.maps[sup.id] = {});
  const changes = []; const counts = {up: 0, down: 0, new: 0};
  R.items.forEach((it, i) => {
    const c = C[i];
    if (c.st === 'ignored' || c.st === 'doubt') return;
    if (c.st === 'new'){
      if (it.include){
        const cat = it.newCat || R.newCat || '';
        const p = {id: newId(), code: it.code || '', name: tidyName(it.desc), category: cat, supplierId: sup.id, cost: c.nc, price: c.np, margin: null, updatedAt: now, priceAt: now, buy: c.pack > 1 ? {type: 'pack', n: c.pack} : {type: 'u'}, sell: 'u'};
        pushHist(p, now);
        S.products.push(p); invalidateIndex();
        maps[it.key] = p.id; changes.push({id: p.id, b: null, a: {cost: p.cost, price: p.price}}); counts.new++;
      } else maps[it.key] = '-';
      return;
    }
    maps[it.key] = it.productId;
    const p = c.p;
    if (c.st === 'same'){ p.checkedAt = now; return; }
    if (!it.include) return;
    const b = {cost: p.cost, price: p.price, updatedAt: p.updatedAt || null, priceAt: p.priceAt || null, supplierId: p.supplierId || null, checkedAt: p.checkedAt || null, buy: p.buy ? {...p.buy} : null, hist: (p.hist || []).slice()};
    p.cost = c.nc; p.updatedAt = now; p.checkedAt = now; p.supplierId = sup.id;
    if (c.pack !== packOf(p) && !(p.buy?.type === 'kg')) p.buy = c.pack > 1 ? {type: 'pack', n: c.pack} : {type: 'u'};
    if (Math.abs(p.price - c.np) > 0.004){ p.price = c.np; p.priceAt = now; }
    pushHist(p, now);
    changes.push({id: p.id, b, a: {cost: p.cost, price: p.price}});
    counts[c.st]++;
  });
  if (R.ivaOverride != null && R.ivaSave){ sup.ivaIncluded = !!R.ivaOverride; }
  const prevListAt = sup.lastListAt || null;
  sup.lastListAt = now; sup.lists = (sup.lists || 0) + 1;
  const batch = {id: newId(), at: now, supId: sup.id, supName: sup.name, source: R.source, file: R.fileName, counts, changes, undone: false, prevListAt};
  S.history.unshift(batch);
  if (S.history.length > 25) S.history.length = 25;
  save('products', 'maps', 'suppliers', 'history');
  ui.review = null; ui.nl = null; ui.doneId = batch.id;
  screen('done');
  if (changes.length) confetti();
}
function confetti(){
  if (window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.createElement('canvas'); cv.id = 'confetti'; document.body.appendChild(cv);
  const dpr = Math.min(2, window.devicePixelRatio || 1), W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--yellow', '--pink', '--sky', '--lime', '--orange', '--blue'].map(v => cs.getPropertyValue(v).trim() || '#FFE135');
  const P = Array.from({length: 60}, () => ({x: W / 2 + (Math.random() - .5) * 80, y: H * 0.32, vx: (Math.random() - .5) * 13, vy: -Math.random() * 13 - 4, r: Math.random() * Math.PI, vr: (Math.random() - .5) * .35, w: 7 + Math.random() * 7, h: 4 + Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)], s: Math.random() < .3}));
  let t = 0;
  (function frame(){
    ctx.clearRect(0, 0, W, H); t++;
    for (const p of P){ p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.strokeStyle = '#17112F'; ctx.lineWidth = 1.2;
      if (p.s){ ctx.beginPath(); ctx.arc(0, 0, p.h, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); } else { ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h); }
      ctx.restore(); }
    if (t < 110) requestAnimationFrame(frame); else cv.remove();
  })();
}
function tidyName(s){
  s = String(s).replace(/\s+/g, ' ').trim();
  if (s === s.toUpperCase() && /[A-Z]/.test(s)){
    s = s.toLowerCase().replace(/(^|[\s(\/-])([a-záéíóúñü])/g, (m, a, b) => a + b.toUpperCase());
    s = s.replace(/\b(\d+(?:[.,]\d+)?)\s?(Kg|Kgs|Gr|Grs|G|Ml|Cc|Lt|Lts|L|Un|U)\b/g, (m, n, u) => n + ' ' + ({kg: 'kg', kgs: 'kg', gr: 'g', grs: 'g', g: 'g', ml: 'ml', cc: 'cc', lt: 'l', lts: 'l', l: 'l', un: 'u', u: 'u'}[u.toLowerCase()]));
    s = s.replace(/\b(De|Del|La|El|Con|Sin|En|Y|X|Para)\b/g, w => w.toLowerCase());
    s = s[0].toUpperCase() + s.slice(1);
  }
  return s;
}
function lastUndoable(){ return S.history.find(h => !h.undone); }
function undoBatch(id){
  const b = S.history.find(h => h.id === id);
  if (!b || b.undone || lastUndoable()?.id !== id) return;
  const del = new Set();
  for (const ch of b.changes.slice().reverse()){
    const p = byId(ch.id); if (!p) continue;
    if (ch.b === null) del.add(p.id);
    else Object.assign(p, ch.b);
  }
  if (del.size) S.products = S.products.filter(p => !del.has(p.id));
  if (b.source !== 'recalculo'){ const sup = supById(b.supId); if (sup) sup.lastListAt = b.prevListAt ?? null; }
  b.undone = true;
  invalidateIndex();
  save('products', 'history', 'suppliers');
}

function importItems(){
  const m = ui.imp, {rows, cols} = m; const out = [];
  let dupes = 0;
  const byCode = new Map(S.products.filter(p => p.code).map(p => [normCode(p.code), p]));
  const byName = new Map(S.products.map(p => [norm(p.name), p]));
  for (let i = cols.header + 1; i < rows.length; i++){
    const r = rows[i];
    const name = String(r[cols.desc] ?? '').trim();
    if (!name || !/[a-záéíóúñ]/i.test(name)) continue;
    const it = {name, code: cols.code >= 0 ? String(r[cols.code] ?? '').trim() : '', category: cols.cat >= 0 ? String(r[cols.cat] ?? '').trim() : '', cost: cols.cost >= 0 ? parseNum(r[cols.cost]) : NaN, price: cols.price >= 0 ? parseNum(r[cols.price]) : NaN};
    if (!(it.cost > 0) && !(it.price > 0)) continue;
    it.existing = (it.code && byCode.get(normCode(it.code))) || byName.get(norm(name)) || null;
    if (it.existing) dupes++;
    out.push(it);
  }
  m.dupes = dupes;
  return out;
}
function doImport(){
  const m = ui.imp; const items = importItems(); const now = Date.now();
  const cats = new Set((S.settings.categories || []).map(c => c.name));
  for (const it of items){
    if (it.category && !cats.has(it.category)){ S.settings.categories.push({name: it.category, margin: null, iva: null}); cats.add(it.category); }
    const p = it.existing || {id: newId(), name: it.name, code: '', category: '', supplierId: m.supId || null, cost: 0, price: 0, margin: null, updatedAt: now, priceAt: now};
    p.name = it.name; if (it.code) p.code = it.code; if (it.category) p.category = it.category; if (m.supId) p.supplierId = m.supId;
    if (it.cost > 0) p.cost = r2(it.cost);
    if (it.price > 0 && !m.recalc) p.price = r2(it.price);
    else if (p.cost > 0) p.price = priceFrom(p.cost, p);
    p.updatedAt = now;
    pushHist(p, now);
    if (!it.existing) S.products.push(p);
  }
  invalidateIndex();
  save('products', 'settings');
  ui.imp = null;
  toast(`Importaste ${items.length} productos.`);
  go('prices');
}

function histHTML(p){
  const h = p.hist.slice(-8);
  const max = Math.max(...h.map(x => x[1]), 1), min = Math.min(...h.map(x => x[1]));
  const W = 280, H = 56, pad = 6;
  const X = i => pad + (h.length === 1 ? 0 : i * (W - 2 * pad) / (h.length - 1));
  const Y = v => max === min ? H / 2 : H - pad - (v - min) / (max - min) * (H - 2 * pad);
  const pts = h.map((x, i) => `${X(i).toFixed(1)},${Y(x[1]).toFixed(1)}`).join(' ');
  const first = h[0][1], last = h[h.length - 1][1];
  const rows = h.slice().reverse().map((x, i, arr) => { const prev = arr[i + 1]; const d = prev && prev[1] > 0 ? (x[1] / prev[1] - 1) * 100 : null; return `<div class="kv"><span>${fmtDate(x[0])}</span><span class="num">costo ${costTxt(x[1])}${d != null && Math.abs(d) >= 0.05 ? ` <span class="chip ${d > 0 ? 'up' : 'down'}">${pctTxt(d)}</span>` : ''}</span><b>$ ${priceTxt(x[2])}</b></div>`; }).join('');
  return `<div class="card flat stack" style="padding:12px"><div class="row"><b class="grow">Historial de costos</b>${first > 0 ? `<span class="chip ${last >= first ? 'up' : 'down'}">${pctTxt((last / first - 1) * 100)}</span>` : ''}</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Evolución del costo"><polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${h.map((x, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(x[1]).toFixed(1)}" r="${i === h.length - 1 ? 4 : 2.5}" fill="${i === h.length - 1 ? 'var(--tag)' : 'var(--ink)'}" stroke="var(--ink)" stroke-width="1"/>`).join('')}</svg>
    <div>${rows}</div></div>`;
}
function pickList(s){
  const R = ui.review; const it = R.items[s.i];
  let ids;
  if (s.q && s.q.trim()){ const qs = norm(s.q).split(' ').filter(Boolean); ids = S.products.filter(p => { const h = norm(p.name + ' ' + p.code); return qs.every(q => h.includes(q)); }).slice(0, 40).map(p => p.id); }
  else ids = (it.cands.length ? it.cands : candidates(it.desc, R.supId, 8).map(c => c.id));
  if (!ids.length) return `<p class="muted small">No hay productos parecidos. Buscalo por nombre o código.</p>`;
  return `<div class="list">${ids.map(id => { const p = byId(id); if (!p) return ''; return `<button class="li" data-a="pickSet" data-id="${id}"><span class="grow"><span class="t">${esc(p.name)}</span><span class="s">${esc([p.category, p.code && 'cód. ' + p.code].filter(Boolean).join(' · ') || ' ')}</span></span>${moneyHTML(p.price)}</button>`; }).join('')}</div>`;
}

/* ============ archivos de salida ============ */
async function saveFile(filename, blob){
  const dl = await capUse('downloads');
  if (!dl){ toast('Para descargar archivos, abrí Remarcá desde tu cuenta de Claude.'); return false; }
  try { const r = await dl.save({filename, data: blob}); if (r?.status === 'saved') toast('Listo: ' + filename); return true; }
  catch (e) {
    if (e?.code === 'declined') return false;
    if (e?.code === 'rate_limited'){ toast('Ya hay una descarga esperando tu confirmación.'); return false; }
    toast('No se pudo guardar el archivo en este dispositivo.'); return false;
  }
}
const stamp = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const fileSafe = s => String(s || 'comercio').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase();
async function exportXlsx(sheetName, rows, filename, widths){
  try { await loadLib('xlsx'); } catch (e) { toast(e.message); return; }
  const ws = XLSX.utils.aoa_to_sheet(rows);
  if (widths) ws['!cols'] = widths.map(w => ({wch: w}));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, sheetName);
  const out = XLSX.write(wb, {bookType: 'xlsx', type: 'array'});
  await saveFile(filename, new Blob([out], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}
function exportPrices(){

  const rows = [['Código', 'Producto', 'Categoría', 'Proveedor', 'Se vende por', 'Costo', 'Margen %', 'Precio de venta', 'Precio actualizado']];

  exportXlsx('Precios', rows, `precios-${fileSafe(S.settings.store)}-${stamp()}.xlsx`, [12, 40, 16, 22, 12, 12, 10, 16, 16]);

function exportBatch(id){

  const rows = [['Código', 'Producto', 'Costo anterior', 'Costo nuevo', 'Precio anterior', 'Precio nuevo', 'Variación %']];
  for (const ch of b.changes){ const p = byId(ch.id); if (!p) continue; rows.push([p.code || '', p.name, ch.b ? ch.b.cost : null, ch.a.cost, ch.b ? ch.b.price : null, ch.a.price, ch.b && ch.b.price ? r2((ch.a.price / ch.b.price - 1) * 100) : null]); }
  exportXlsx('Cambios', rows, `cambios-${fileSafe(b.supName)}-${stamp()}.xlsx`, [12, 40, 14, 14, 14, 14, 12]);

async function makeLabels(ids, size, withStore){
  try { await loadLib('jspdf'); } catch (e) { toast(e.message); return; }
  const prods = ids.map(byId).filter(Boolean).sort((a, b) => a.name.localeCompare(b.name, 'es'));
  if (!prods.length) return;
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit: 'mm', format: 'a4'});
  const L = {s: {cols: 4, rows: 10, price: 22, name: 7.5, foot: 5.5}, m: {cols: 3, rows: 8, price: 30, name: 9, foot: 6.5}, g: {cols: 2, rows: 5, price: 50, name: 13, foot: 8}}[size] || {cols: 3, rows: 8, price: 30, name: 9, foot: 6.5};
  const mx = 8, my = 8, W = (210 - 2 * mx) / L.cols, H = (297 - 2 * my) / L.rows, pad = 2.6, pt = 0.3528;
  const date = fmtDate(Date.now());
  prods.forEach((p, i) => {
    const k = i % (L.cols * L.rows);
    if (i && !k) doc.addPage();
    const x = mx + (k % L.cols) * W, y = my + Math.floor(k / L.cols) * H;
    doc.setDrawColor(200); doc.setLineDashPattern([1, 1], 0); doc.setLineWidth(0.2); doc.rect(x, y, W, H);
    doc.setLineDashPattern([], 0);
    doc.setTextColor(20, 20, 20);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(L.name);
    const lines = doc.splitTextToSize(p.name, W - 2 * pad).slice(0, 2);
    doc.text(lines, x + pad, y + pad + L.name * pt);
    if (unitTxt(p)){ doc.setFont('helvetica', 'normal'); doc.setFontSize(L.name * 0.85); doc.text(unitTxt(p), x + pad, y + pad + L.name * pt * (lines.length + 1) + 0.8); doc.setFont('helvetica', 'bold'); }
    // precio
    const txt = priceTxt(p.price);
    let fs = L.price;
    doc.setFontSize(fs);
    while (doc.getTextWidth(txt) + 6 > W - 2 * pad && fs > 10){ fs -= 1; doc.setFontSize(fs); }
    const py = y + H - pad - L.foot * pt - 1.2;
    doc.text(txt, x + W - pad, py, {align: 'right'});
    const tw = doc.getTextWidth(txt);
    doc.setFontSize(fs * 0.5); doc.text('$', x + W - pad - tw - 1, py - fs * pt * 0.38, {align: 'right'});
    doc.setFont('helvetica', 'normal'); doc.setFontSize(L.foot); doc.setTextColor(90, 90, 90);
    doc.text([date, withStore ? S.settings.store : ''].filter(Boolean).join(' · ').slice(0, 60), x + pad, y + H - pad);
    if (p.code) doc.text(String(p.code).slice(0, 16), x + W - pad, y + H - pad, {align: 'right'});
  });
  const blob = doc.output('blob');
  await saveFile(`etiquetas-${fileSafe(S.settings.store)}-${stamp()}.pdf`, blob);
}

/* ============ recalcular ============ */
function recalcAll(){
  const now = Date.now(); const changes = [];
  for (const p of S.products){
    if (!(p.cost > 0) || p.lock) continue;
    const np = priceFrom(p.cost, p);
    if (Math.abs(np - p.price) > 0.004){ changes.push({id: p.id, b: {cost: p.cost, price: p.price, updatedAt: p.updatedAt || null, priceAt: p.priceAt || null, supplierId: p.supplierId || null, checkedAt: p.checkedAt || null, hist: (p.hist || []).slice()}, a: {cost: p.cost, price: np}}); p.price = np; p.priceAt = now; pushHist(p, now); }
  }
  if (!changes.length) return;
  const up = changes.filter(c => c.a.price > c.b.price).length;
  const b = {id: newId(), at: now, supId: null, supName: 'Recálculo con márgenes', source: 'recalculo', file: '', counts: {up, down: changes.length - up, new: 0}, changes, undone: false};
  S.history.unshift(b); if (S.history.length > 25) S.history.length = 25;
  save('products', 'history');
  ui.doneId = b.id; screen('done');
}

/* ============ toasts ============ */
function toast(msg, action){
  const box = $('#toast');
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `<span class="grow">${esc(msg)}</span>${action ? `<button>${esc(action.label)}</button>` : ''}`;
  if (action) t.querySelector('button').onclick = () => { t.remove(); action.fn(); };
  box.appendChild(t);
  setTimeout(() => t.remove(), action ? 7000 : 3800);
}

function pickFile(accept, opts = {}){
  return new Promise(res => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = accept; inp.hidden = true;
    if (opts.capture) inp.setAttribute('capture', 'environment');
    if (opts.multiple) inp.multiple = true;
    inp.onchange = () => { res(inp.files ? [...inp.files] : []); inp.remove(); };
    document.body.appendChild(inp); inp.click();
  });
}
